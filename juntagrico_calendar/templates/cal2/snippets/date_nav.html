{% load cal.time %}
{% load juntagrico.config %}
{% load i18n %}

<div id="calendar-navbar" class="py-2">
    <ul class="nav nav-tabs mb-2">
        {% for year in years %}
            <li class="nav-item">
                <a class="nav-link{% if year == selected.year %} active{% endif %}"
                   href="{% url 'jobs-archive-by-month' year selected.month %}">
                    {{ year }}
                </a>
            </li>
        {% endfor %}
    </ul>
    <ul class="nav nav-tabs mb-2">
        {% for month in months %}
            <li class="nav-item">
                <a class="nav-link{% if month.month == selected.month %} active{% endif %}{% if month not in months_with_jobs %} disabled{% endif %}"
                   href="{% url 'jobs-archive-by-month' month.year month.month %}">
                    {{ month|date:'M' }}
                </a>
            </li>
        {% endfor %}
    </ul>
</div>

<div class="archive-calendar mx-auto mt-5">
    {% calendar selected.year selected.month 'archive' %}
</div>
