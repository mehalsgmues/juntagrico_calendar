name: juntagrico-ci

on:
  push:
    branches: [ main ]
  pull_request_target:
    branches: [ main, 'releases/**' ]

jobs:
  # run tests. DO NOT use secrets and write permissions here
  tests:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DJANGO_SETTINGS_MODULE: testsettings
      PYTHONPATH: .
      COVERAGE_FILE: coverage
    strategy:
      matrix:
        include:
          - python-version: '3.12'

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: install dependencies
      run: |
        pip install --upgrade -r requirements.txt
        pip install psycopg
    - name: ruff
      run: |
        ruff check --preview juntagrico
    - name: run tests on postgres
      run: |
        python -m django makemigrations --noinput
        coverage run -m manage test
    - run: coverage lcov -o coverage.lcov
      if: ${{ matrix.python-version  == '3.12' }}
    - uses: actions/upload-artifact@v6
      if: ${{ matrix.python-version  == '3.12' }}
      with:
        name: coverage
        path: coverage.lcov

  # upload coverage. DO NOT execute PR code here
  coverage:
    name: Coverage Report
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v6
        with:
          path: coverage
          merge-multiple: true
      - uses: qltysh/qlty-action/coverage@v2
        with:
          oidc: true
          files: coverage/coverage*.lcov
